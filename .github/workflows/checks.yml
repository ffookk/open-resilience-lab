name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Privacy guard
        run: python scripts/privacy_check.py --history
      - name: English contribution policy
        run: python scripts/check_english.py
      - name: Unit tests with Node available
        run: |
          node --version
          python -m unittest discover -s tests -v
      - name: Validate documented examples
        run: python resilience_plan.py examples/fictional-household.json --output private-output/ci-demo.html
      - name: Create a private draft template
        run: python resilience_plan.py init --output private-input/ci-draft.json

  browser:
    name: Chromium and Firefox regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install pinned browser development tools
        working-directory: tools/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser engines
        working-directory: tools/browser
        run: npx --no-install playwright install --with-deps chromium firefox
      - name: Test generated pages with external requests blocked
        working-directory: tools/browser
        run: npm test

  validate:
    name: validate
    if: ${{ always() }}
    needs: [tests, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job to pass
        env:
          UNIT_RESULT: ${{ needs.tests.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
